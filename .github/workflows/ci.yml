name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./backend
      - name: Typecheck backend
        run: npx tsc --noEmit
        working-directory: ./backend

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Generate TanStack Routes
        run: npx @tanstack/router-cli generate
        working-directory: ./frontend
      - name: Typecheck frontend
        run: npx tsc --noEmit
        working-directory: ./frontend

  ai-service-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adhikar_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
        working-directory: ./ai-service
      - name: Initialize Database
        run: |
          export PYTHONPATH=.
          export DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/adhikar_ai
          python scripts/init_db.py
          python scripts/seed_golden_schemes.py
        working-directory: ./ai-service
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/adhikar_ai
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH=.
          pytest tests/
        working-directory: ./ai-service
