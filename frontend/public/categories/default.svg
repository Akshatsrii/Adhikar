<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Warm Indian Governance Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3B24"/>
      <stop offset="60%" stop-color="#072718"/>
      <stop offset="100%" stop-color="#02140C"/>
    </linearGradient>
    
    <!-- Tricolor Saffron Glow -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF7729" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Deep Forest Green Canvas -->
  <rect width="400" height="240" fill="url(#bgGrad)"/>

  <!-- Subtle Indian Architecture Watermark Motif -->
  <g opacity="0.12" fill="#FFFFFF">
    <circle cx="200" cy="100" r="60"/>
    <path d="M120 180 L280 180 L270 110 L130 110 Z"/>
    <line x1="140" y1="110" x2="140" y2="180" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="160" y1="110" x2="160" y2="180" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="180" y1="110" x2="180" y2="180" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="200" y1="110" x2="200" y2="180" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="220" y1="110" x2="220" y2="180" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="240" y1="110" x2="240" y2="180" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="260" y1="110" x2="260" y2="180" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Smooth Tricolor Ribbon Waves at Bottom -->
  <path d="M0 185 Q100 170 200 190 T400 180 L400 240 L0 240 Z" fill="url(#saffronGrad)"/>
  <path d="M0 200 Q120 185 240 205 T400 195 L400 240 L0 240 Z" fill="#FFFFFF" opacity="0.3"/>
  <path d="M0 215 Q140 200 260 220 T400 210 L400 240 L0 240 Z" fill="url(#greenGrad)"/>

  <!-- Central Emblem / Icon Graphic -->
  <g transform="translate(170, 70)">
    <!-- Shield Outline -->
    <path d="M30 0 C48 0 60 8 60 8 C60 38 48 55 30 68 C12 55 0 38 0 8 C0 8 12 0 30 0 Z" fill="#FF5500" opacity="0.2"/>
    <path d="M30 2 C46 2 56 9 56 9 C56 36 46 51 30 63 C14 51 4 36 4 9 C4 9 14 2 30 2 Z" fill="none" stroke="#FF7729" stroke-width="2"/>
    <!-- Person / Ashoka Figure Silhouette -->
    <circle cx="30" cy="22" r="6" fill="#FFFFFF"/>
    <path d="M22 44 C22 34 25 30 30 30 C35 30 38 34 38 44 Z" fill="#FFFFFF"/>
    <path d="M16 46 Q30 36 44 46" stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Clean Top Badge -->
  <rect x="24" y="20" width="130" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="89" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GOVT OF INDIA</text>
</svg>
