<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Dark Radial Luxury Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1F1713"/>
      <stop offset="45%" stop-color="#120E0C"/>
      <stop offset="100%" stop-color="#090706"/>
    </radialGradient>
    
    <!-- Signature Adhikar Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7729"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#CC3E00"/>
    </linearGradient>

    <!-- Warm Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="240" rx="0" fill="url(#bgGrad)"/>

  <!-- Subtle Micro Grid Pattern -->
  <g opacity="0.08" stroke="#FF5500" stroke-width="0.75">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="240"/>
  </g>

  <!-- Ambient Central Orange Glow -->
  <circle cx="200" cy="110" r="70" fill="#FF5500" opacity="0.12" filter="url(#glow)"/>

  <!-- Geometric Concentric Rings -->
  <circle cx="200" cy="110" r="85" fill="none" stroke="#FF5500" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="110" r="95" fill="none" stroke="#FBBF24" stroke-width="0.75" stroke-dasharray="6,8" opacity="0.2"/>

  <!-- Decorative Corner Accents -->
  <path d="M20 35 L20 20 L35 20" fill="none" stroke="#FF5500" stroke-width="2" opacity="0.4"/>
  <path d="M380 35 L380 20 L365 20" fill="none" stroke="#FF5500" stroke-width="2" opacity="0.4"/>
  <path d="M20 205 L20 220 L35 220" fill="none" stroke="#FF5500" stroke-width="2" opacity="0.4"/>
  <path d="M380 205 L380 220 L365 220" fill="none" stroke="#FF5500" stroke-width="2" opacity="0.4"/>

  <!-- Central Icon Graphic -->
  <g id="iconGraphic">
    
          <!-- Wheat stalk and Sprout -->
          <path d="M200 50 Q200 170 195 185" stroke="#FF5500" stroke-width="5" stroke-linecap="round"/>
          <path d="M200 70 Q240 60 235 85 Q210 90 200 95" fill="url(#orangeGrad)" stroke="#FBBF24" stroke-width="2"/>
          <path d="M200 90 Q160 80 165 105 Q190 110 200 115" fill="url(#orangeGrad)" stroke="#FBBF24" stroke-width="2"/>
          <path d="M200 110 Q245 100 240 125 Q215 130 200 135" fill="url(#orangeGrad)" stroke="#FBBF24" stroke-width="2"/>
          <path d="M200 130 Q155 120 160 145 Q185 150 200 155" fill="url(#orangeGrad)" stroke="#FBBF24" stroke-width="2"/>
          <!-- Sun Rays -->
          <circle cx="200" cy="45" r="14" fill="#FBBF24"/>
          <circle cx="200" cy="45" r="22" fill="none" stroke="#FF5500" stroke-width="2" stroke-dasharray="4,4"/>
        
  </g>

  <!-- Bottom Brand Text Strip -->
  <rect x="0" y="200" width="400" height="40" fill="#000000" opacity="0.75"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#FF5500" stroke-width="1.5" opacity="0.35"/>

  <!-- Scheme Category Subtitle -->
  <text x="200" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#FF9E59" text-anchor="middle">
    AGRICULTURE & FARMERS
  </text>
</svg>